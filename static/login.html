<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rutas Puebla · Entrar</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
  <div id="mensaje" role="status" aria-live="polite"></div>
  <header class="cabecera">
    <div class="cabecera-contenido">
      <h1>Rutas Puebla</h1>
      <p class="subtitulo">Encuentra las rutas de transporte que pasan cerca de ti</p>
    </div>
  </header>
  <main class="solo">
    <section class="panel login">
      <div class="pestanas">
        <button type="button" id="tab-entrar" class="activa">Iniciar sesión</button>
        <button type="button" id="tab-crear">Crear cuenta</button>
      </div>
      <form id="form-login">
        <div class="campo">
          <label for="usuario">Usuario</label>
          <input id="usuario" required minlength="3" autocomplete="username">
        </div>
        <div class="campo">
          <label for="password">Contraseña</label>
          <input id="password" type="password" required minlength="6" autocomplete="current-password">
          <span class="ayuda" id="ayuda-login">Entra como pasajero o como administrador.</span>
        </div>
        <button type="submit" class="btn-principal" id="btn-login">Entrar</button>
      </form>
    </section>
  </main>
  <script src="/static/auth.js"></script>
  <script>
    const s = sesion();
    if (s) location.href = s.rol === "admin" ? "/admin" : "/pasajero";

    let modo = "login";
    const $ = id => document.getElementById(id);
    function cambiar(m) {
      modo = m;
      $("tab-entrar").classList.toggle("activa", m === "login");
      $("tab-crear").classList.toggle("activa", m === "registro");
      $("btn-login").textContent = m === "login" ? "Entrar" : "Crear cuenta de pasajero";
      $("ayuda-login").textContent = m === "login"
        ? "Entra como pasajero o como administrador."
        : "Mínimo 6 caracteres. Las cuentas nuevas son de pasajero.";
    }
    $("tab-entrar").onclick = () => cambiar("login");
    $("tab-crear").onclick = () => cambiar("registro");

    function aviso(texto) {
      const m = $("mensaje");
      m.textContent = texto; m.className = "error";
      setTimeout(() => { m.textContent = ""; m.className = ""; }, 4000);
    }

    $("form-login").addEventListener("submit", async e => {
      e.preventDefault();
      try {
        const r = await fetch(modo === "login" ? "/auth/login" : "/auth/registro", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ usuario: $("usuario").value, password: $("password").value })
        });
        const d = await r.json();
        if (!r.ok) throw new Error(typeof d.detail === "string" ? d.detail : "Revisa tus datos (usuario 3+, contraseña 6+ caracteres)");
        guardarSesion(d);
        location.href = d.rol === "admin" ? "/admin" : "/pasajero";
      } catch (err) { aviso(err.message); }
    });
  </script>
</body>
</html>
